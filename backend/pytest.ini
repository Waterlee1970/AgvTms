[pytest]
# AGV-TMS Backend pytest Configuration — Phase 5.5
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (need DB/Redis/Kafka)
    slow: Slow tests (benchmark/stress)
    algorithm: Algorithm-specific tests
    resilience: Circuit breaker and rate limiter tests

# Coverage settings
addopts = 
    --tb=short
    -v
    --strict-markers

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Logging (use -s or --capture=no to see)
log_cli = false
log_cli_level = INFO
