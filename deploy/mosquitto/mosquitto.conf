# Mosquitto MQTT Broker Configuration — AGV-TMS
# 
# Usage:
#   docker compose up mosquitto   (standalone)
#   docker compose up -d           (full stack)

# Persistence
persistence true
persistence_location /mosquitto/data

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type all
log_timestamp true

# Connection limits
max_connections 500
max_keepalive 300

# AGV-TMS specific settings
# Allow anonymous connections for dev (remove in production)
allow_anonymous true

# Message size limit (AGV status ~1KB, VDA5050 order ~10KB)
message_size_limit 65536

# Retained messages
max_retained_messages 10000
