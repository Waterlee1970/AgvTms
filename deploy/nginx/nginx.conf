# AGV-TMS Nginx 配置 — 负载均衡 + 反向代理 (Phase 5.5)
#
# 功能:
#   1. 后端多实例负载均衡 (Round Robin + 健康检查)
#   2. 静态资源缓存
#   3. WebSocket 支持 (3D数字孪生实时通信)
#   4. Gzip 压缩
#   5. 安全头设置
#   6. 限流控制
#   7. SSL/TLS 终止 (生产环境)

# 工作进程数 (自动检测CPU核心)
worker_processes auto;
worker_rlimit_nofile 65535;

# 错误日志路径
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # 最大连接数
    worker_connections 4096;
    
    # 使用 epoll (Linux) 或 kqueue (macOS/BSD)
    use epoll;
    
    # 允许一个 worker 同时接受多个连接
    multi_accept on;
}

http {
    # ==================== 基础配置 ====================
    
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式 (包含响应时间和上游信息)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time '
                    'upstream=$upstream_addr upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript 
               text/xml application/xml application/rss+xml text/javascript 
               image/svg+xml font/woff2;
    gzip_min_length 1000;

    # ==================== 限流配置 ====================
    
    # 全局限流: 每IP每秒20个请求，突发50个
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    
    # API限流: 每IP每秒10个请求，突发20个
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # 连接数限制
    limit_conn_zone $binary_remote_addr zone=connlimit:10m;
    limit_conn connlimit 50;

    # ==================== 上游服务定义 ====================
    
    # FastAPI 后端集群 (Round Robin 负载均衡)
    upstream backend_cluster {
        # 最少连接算法 (推荐用于长时间运行的调度任务)
        least_conn;
        
        # 可动态扩展的后端实例列表
        # Docker Compose --scale backend=N 时自动发现
        server backend-1:8000 weight=1 max_fails=3 fail_timeout=30s;
        # server backend-2:8000 weight=1 max_fails=3 fail_timeout=30s;  # 扩展实例
        # server backend-3:8000 weight=1 max_fails=3 fail_timeout=30s;
        
        # 长连接保持 (减少TCP握手开销)
        keepalive 32;
    }

    # 前端静态服务 (可选: 多实例)
    upstream frontend_cluster {
        server frontend:3000;
        keepalive 16;
    }

    # ==================== Server Block ====================

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # 根目录
        root /usr/share/nginx/html;
        index index.html index.htm;

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ==================== API 反向代理 ====================

        location /api/ {
            proxy_pass http://backend_cluster;
            
            # 头部转发
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # 超时配置 (调度算法可能耗时较长)
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;     # 允许长时间运行的MIP/ACO计算
            proxy_read_timeout 120s;
            
            # 缓冲区配置
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            
            # 长连接复用
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # API限流
            limit_req zone=api burst=20 nodelay;

            # 错误处理
            proxy_intercept_errors off;
        }

        # ==================== 健康检查端点 ====================

        location ~ ^/(healthz|readyz|livez) {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            access_log off;  # 不记录健康检查日志
            
            # 快速超时
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
        }

        # ==================== WebSocket 支持 ====================
        
        location /ws/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # WebSocket超时 (长连接)
            proxy_read_timeout 86400s;      # 24小时
            proxy_send_timeout 86400s;
        }

        # ==================== 前端静态资源 ====================

        location / {
            # 开发环境: 代理到前端开发服务器
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 缓存静态资源
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # 静态资源长期缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend_cluster;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ==================== InfluxDB API 代理 (可选) ====================
        
        location /influxdb/ {
            proxy_pass http://influxdb:8086/;
            proxy_set_header Host $host;
            proxy_set_header X-Influxdb-Org "agv-tms";
            
            # 大数据量查询允许较长超时
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # ==================== 错误页面 ====================

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # 429 Too Many Requests (触发限流时)
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error": "Too many requests", "retry_after": 1}';
        }
    }
}
