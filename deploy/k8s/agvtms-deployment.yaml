# AGV-TMS Kubernetes Deployment Manifests
# kubectl apply -f deploy/k8s/agvtms-deployment.yaml

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agvtms-backend
  labels:
    app: agvtms
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agvtms
      component: backend
  template:
    metadata:
      labels:
        app: agvtms
        component: backend
    spec:
      containers:
        - name: backend
          image: agvtms/backend:2.0.0
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agvtms-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://agvtms-redis:6379/0"
            - name: ACTIVE_ALGORITHM_VERSION
              value: "v2"
            - name: USE_DB_PERSISTENCE
              value: "true"
            - name: USE_REDIS_CACHE
              value: "true"
          resources:
            limits:
              cpu: "2000m"
              memory: "2Gi"
            requests:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: agvtms-backend
spec:
  selector:
    app: agvtms
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agvtms-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agvtms-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agvtms-frontend
  labels:
    app: agvtms
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agvtms
      component: frontend
  template:
    metadata:
      labels:
        app: agvtms
        component: frontend
    spec:
      containers:
        - name: frontend
          image: agvtms/frontend:2.0.0
          ports:
            - containerPort: 3000
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: agvtms-frontend
spec:
  selector:
    app: agvtms
    component: frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agvtms-monitor
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: agvtms
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
