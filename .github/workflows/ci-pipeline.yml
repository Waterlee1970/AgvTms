# AgvTms CI/CD Pipeline
# 
# 对标海康RCS CI/CD规范，实现:
# 1. 自动化代码质量检查 (Lint + Type Check)
# 2. 单元测试 + 覆盖率报告
# 3. 集成测试 (可选依赖)
# 4. 安全扫描 (依赖漏洞检测)
# 5. 构建Docker镜像 (仅main分支)
#
# 触发条件:
# - push到main/develop/release/*分支
# - Pull Request到main

name: CI Pipeline

on:
  push:
    branches: [main, develop, 'release/*', '2.4']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # ==================== Job 1: 后端代码质量检查 ====================
  lint-backend:
    name: Backend Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install ruff black mypy pytest
      
      - name: Ruff Linting (Fast Python Linter)
        run: cd backend && ruff check . --output-format=github
      
      - name: Black Format Check
        run: cd backend && black --check --diff .
      
      - name: MyPy Type Checking
        run: |
          cd backend
          mypy app/ --ignore-missing-imports \
            --no-strict-optional \
            || true  # 暂不阻塞CI，先收集type error信息

  # ==================== Job 2: 单元测试 + 覆盖率 ====================
  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-backend]  # 代码检查通过后才运行测试
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: agvtms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt  # 或 requirements-dev.txt
          pip install pytest pytest-cov pytest-asyncio httpx pytest-xdist
      
      - name: Run unit tests with coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/agvtms_test
          REDIS_URL: redis://localhost:6379/1
          TESTING: true
        run: |
          cd backend
          pytest tests/ \
            -v \
            -m "unit and not slow" \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60 \
            --junitxml=test-results.xml \
            --dist=loadscope  # 并行执行(需要pytest-xdist)
      
      - name: Upload coverage to Codecov (可选)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v3
        with:
          file: backend/coverage.xml
          flags: unittests
          fail_ci_if_error: false
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/test-results.xml
            backend/coverage.xml
          retention-days: 7

  # ==================== Job 3: 集成测试 (可选) ====================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 45
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: agvtms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
      
      mqtt:
        image: eclipse-mosquitto:2
        ports: ['1883:1883']
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov paho-mqtt asyncua
      
      - name: Run integration tests
        env:
          MQTT_BROKER_HOST: localhost
          MQTT_BROKER_PORT: 1883
          OPCUA_SERVER_URL: opc.tcp://localhost:4840
          DATABASE_URL: postgresql://test:test@localhost:5432/agvtms_test
          REDIS_URL: redis://localhost:6379/1
        run: |
          cd backend
          pytest tests/ -m "integration" -v --tb=long --timeout=60

  # ==================== Job 4: 前端构建测试 ====================
  build-frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run ESLint
        working-directory: frontend
        run: npx eslint src/ --ext .ts,.tsx,.js,.jsx || true  # 暂不阻塞
      
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ==================== Job 5: Docker构建 (仅main分支) ====================
  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/agvtms
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== Job 6: 安全扫描 ====================
  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install safety (Python vulnerability scanner)
        run: pip install safety
      
      - name: Check Python dependencies for vulnerabilities
        run: |
          cd backend
          safety check -r requirements.txt || true  # 暂不阻塞CI
      
      - name: Run Trivy vulnerability scanner (容器镜像)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'  # 仅报告不阻塞
          severity: 'CRITICAL,HIGH'

  # ==================== Job 7: CI状态汇总通知 (可选) ====================
  notify:
    name: CI Status Summary
    runs-on: ubuntu-latest
    needs: [lint-backend, test-backend, build-frontend, security-scan]
    if: always()  # 无论前面job成功失败都运行
    timeout-minutes: 5
    
    steps:
      - name: Check job status
        run: |
          echo "## CI Pipeline Status Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build | ${{ needs.build-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
